<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DM-Diff - 全量看板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">DM-Diff</a>
            <span class="navbar-text">全量看板</span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h4>源库（旧库）</h4>
                        <p class="text-sm text-white-75">
                            <span th:text="${sourceConfig.host}"></span>:<span th:text="${sourceConfig.port}"></span>
                            / <span th:text="${sourceConfig.database}"></span>
                        </p>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-6">
                                <div class="card bg-light">
                                    <div class="card-body">
                                        <div class="text-3xl font-bold text-danger" th:text="${sourceStats.tableCount}"></div>
                                        <div class="text-sm text-muted">表数量</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="card bg-light">
                                    <div class="card-body">
                                        <div class="text-3xl font-bold text-danger" th:text="${sourceStats.viewCount}"></div>
                                        <div class="text-sm text-muted">视图数量</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6 mt-3">
                                <div class="card bg-light">
                                    <div class="card-body">
                                        <div class="text-3xl font-bold text-danger" th:text="${sourceStats.indexCount}"></div>
                                        <div class="text-sm text-muted">索引数量</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6 mt-3">
                                <div class="card bg-light">
                                    <div class="card-body">
                                        <div class="text-3xl font-bold text-danger" th:text="${sourceStats.procedureCount}"></div>
                                        <div class="text-sm text-muted">存储过程</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h4>目标库（新库）</h4>
                        <p class="text-sm text-white-75">
                            <span th:text="${targetConfig.host}"></span>:<span th:text="${targetConfig.port}"></span>
                            / <span th:text="${targetConfig.database}"></span>
                        </p>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-6">
                                <div class="card bg-light">
                                    <div class="card-body">
                                        <div class="text-3xl font-bold text-success" th:text="${targetStats.tableCount}"></div>
                                        <div class="text-sm text-muted">表数量</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="card bg-light">
                                    <div class="card-body">
                                        <div class="text-3xl font-bold text-success" th:text="${targetStats.viewCount}"></div>
                                        <div class="text-sm text-muted">视图数量</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6 mt-3">
                                <div class="card bg-light">
                                    <div class="card-body">
                                        <div class="text-3xl font-bold text-success" th:text="${targetStats.indexCount}"></div>
                                        <div class="text-sm text-muted">索引数量</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6 mt-3">
                                <div class="card bg-light">
                                    <div class="card-body">
                                        <div class="text-3xl font-bold text-success" th:text="${targetStats.procedureCount}"></div>
                                        <div class="text-sm text-muted">存储过程</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h4>比对选项</h4>
                    </div>
                    <div class="card-body">
                        <form id="diffForm">
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="ignoreCase">
                                        <label class="form-check-label" for="ignoreCase">
                                            忽略表名/字段名大小写
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">表名黑名单（正则表达式，逗号分隔）</label>
                                    <input type="text" class="form-control" id="blacklist" placeholder="例如: .*_BAK, .*_TEMP">
                                </div>
                                <div class="col-md-2 align-self-end">
                                    <button type="button" class="btn btn-info w-100" onclick="startDiff()">
                                        开始比对
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12 text-center">
                <a href="/" class="btn btn-secondary">返回连接配置</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function startDiff() {
            const ignoreCase = document.getElementById('ignoreCase').checked;
            const blacklistInput = document.getElementById('blacklist').value;
            
            let url = `/diff?ignoreCase=${ignoreCase}`;
            
            if (blacklistInput && blacklistInput.trim()) {
                const blacklistItems = blacklistInput.split(',').map(item => item.trim()).filter(item => item);
                blacklistItems.forEach(item => {
                    url += `&blacklist=${encodeURIComponent(item)}`;
                });
            }
            
            window.location.href = url;
        }
    </script>
</body>
</html>
