<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DM-Diff - 数据迁移</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table-checkbox-list { max-height: 500px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 6px; padding: 8px; }
        .table-checkbox-list .form-check { padding: 6px 8px; border-radius: 4px; transition: background 0.15s; }
        .table-checkbox-list .form-check:hover { background: rgba(13, 110, 253, 0.06); }
        .table-checkbox-list .form-check .badge { font-size: 11px; }
        .log-container { max-height: 400px; overflow-y: auto; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; background: #1a1d20; border-radius: 6px; }
        .log-item { padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: flex-start; gap: 10px; }
        .log-item:last-child { border-bottom: none; }
        .log-success { background: rgba(25, 135, 84, 0.12); }
        .log-error { background: rgba(220, 53, 69, 0.12); }
        .log-info { background: rgba(13, 110, 253, 0.10); }
        .log-phase { flex-shrink: 0; min-width: 72px; font-size: 11px; padding: 2px 8px; border-radius: 4px; text-align: center; font-weight: 600; }
        .phase-struct { background: #0d6efd; color: #fff; }
        .phase-data { background: #198754; color: #fff; }
        .spinner-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.45); align-items: center; justify-content: center; z-index: 1050;
        }
        .spinner-overlay.active { display: flex; }
        .toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 1100; width: auto; max-width: 320px; }
        .stats-bar { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
        .stats-bar .stat { font-size: 14px; }
        .tab-content { min-height: 300px; }
        @media (max-width: 768px) {
            .table-checkbox-list { max-height: 300px; }
            .log-item { flex-direction: column; align-items: stretch; }
            .log-phase { min-width: auto; }
        }
        [data-bs-theme="dark"] .card { background-color: #2b3035; border-color: #495057; }
        [data-bs-theme="dark"] .card-header { background-color: #343a40; }
        [data-bs-theme="dark"] .table-checkbox-list { border-color: #495057; }
        [data-bs-theme="dark"] .table-checkbox-list .form-check:hover { background: rgba(13, 110, 253, 0.10); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">DM-Diff</a>
            <span class="navbar-text">数据迁移</span>
            <button class="btn btn-sm btn-outline-light ms-auto" onclick="toggleTheme()" id="themeToggle" style="font-size:13px">🌙 夜间</button>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="alert alert-info d-flex align-items-center gap-2 py-2 mb-3" style="font-size:14px">
            <span class="fw-bold">🔄 迁移方向：</span>
            <span class="badge bg-danger">源库（旧库）</span>
            <span th:text="' ' + ${sourceConfig.host} + ':' + ${sourceConfig.port} + '/' + ${sourceConfig.database}"></span>
            <span class="mx-2">→</span>
            <span class="badge bg-success">目标库（新库）</span>
            <span th:text="' ' + ${targetConfig.host} + ':' + ${targetConfig.port} + '/' + ${targetConfig.database}"></span>
        </div>

        <ul class="nav nav-tabs mb-4" id="migrationTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="config-tab" data-bs-toggle="tab" data-bs-target="#config" type="button" role="tab">迁移配置</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="progress-tab" data-bs-toggle="tab" data-bs-target="#progress" type="button" role="tab">迁移进度</button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="config" role="tabpanel">
                <div class="row">
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span><strong>选择要迁移的表</strong> <span id="selectedCount" class="text-muted" style="font-size:13px">已选 0 张</span></span>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-sm btn-outline-primary" onclick="selectAll(true)">全选</button>
                                    <button class="btn btn-sm btn-outline-secondary" onclick="selectAll(false)">取消全选</button>
                                    <button class="btn btn-sm btn-outline-info" onclick="selectByStatus(true)">仅选目标库不存在</button>
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <input type="text" class="form-control form-control-sm" id="tableFilter" placeholder="搜索表名..." oninput="filterTables()">
                                </div>
                                <div id="tableList" class="table-checkbox-list">
                                    <div class="text-center text-muted py-4">加载中...</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-header"><strong>迁移选项</strong></div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="migrateStructure" checked>
                                        <label class="form-check-label" for="migrateStructure">迁移表结构</label>
                                    </div>
                                    <div class="form-check form-switch mt-2">
                                        <input class="form-check-input" type="checkbox" id="migrateData" checked>
                                        <label class="form-check-label" for="migrateData">迁移表数据</label>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">每批处理行数</label>
                                    <input type="number" class="form-control form-control-sm" id="batchSize" value="1000" min="100" max="10000">
                                </div>
                                <hr>
                                <div class="d-grid gap-2">
                                    <button class="btn btn-primary" onclick="startMigration()" id="startBtn">
                                        <span id="startBtnText">开始迁移</span>
                                    </button>
                                </div>
                                <div class="mt-3 text-center">
                                    <small class="text-muted">先迁移表结构，再迁移表数据</small>
                                </div>
                            </div>
                        </div>
                        <div class="card mt-3">
                            <div class="card-header"><strong>迁移统计</strong></div>
                            <div class="card-body">
                                <div id="statsContent" class="stats-bar">
                                    <div class="stat"><span id="totalTables">0</span> 张表</div>
                                    <div class="stat"><span id="totalData">0</span> 行数据</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="progress" role="tabpanel">
                <div class="row">
                    <div class="col-12 mb-3">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span><strong>迁移进度</strong></span>
                                <span id="progressSummary" class="text-muted" style="font-size:13px"></span>
                            </div>
                            <div class="card-body">
                                <div class="progress mb-3" style="height:12px">
                                    <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width:0%"></div>
                                </div>
                                <div id="progressText" class="text-center text-muted mb-2" style="font-size:13px">等待开始...</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span><strong>执行日志</strong></span>
                                <button class="btn btn-sm btn-outline-secondary" onclick="clearLog()">清空日志</button>
                            </div>
                            <div class="card-body p-0">
                                <div id="logContainer" class="log-container text-light">
                                    <div class="log-item log-info">
                                        <span class="text-muted">等待执行...</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 mt-3">
                        <div class="d-flex gap-2 flex-wrap">
                            <button class="btn btn-outline-primary" onclick="switchToConfig()">返回配置</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12 text-center">
                <a href="/dashboard" class="btn btn-outline-secondary mb-2">返回看板</a>
                <a href="/" class="btn btn-outline-info mb-2">连接配置</a>
            </div>
        </div>
    </div>

    <div id="spinnerOverlay" class="spinner-overlay">
        <div class="spinner-border text-light" role="status">
            <span class="visually-hidden">加载中...</span>
        </div>
    </div>
    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allTables = [];
        let selectedTables = new Set();

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-bs-theme') === 'dark';
            html.setAttribute('data-bs-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeToggle').textContent = isDark ? '🌙 夜间' : '☀️ 日间';
            localStorage.setItem('dm-diff-theme', isDark ? 'light' : 'dark');
        }
        const savedTheme = localStorage.getItem('dm-diff-theme');
        if (savedTheme) document.documentElement.setAttribute('data-bs-theme', savedTheme);

        window.addEventListener('DOMContentLoaded', function() {
            loadTables();
        });

        async function loadTables() {
            try {
                const resp = await fetch('/migration/tables');
                const data = await resp.json();
                if (!data.success) {
                    showToast('加载表列表失败: ' + (data.message || ''), 'danger');
                    return;
                }
                allTables = data.tables || [];
                renderTables(allTables);
                updateStats();
            } catch (e) {
                showToast('加载表列表失败: ' + e.message, 'danger');
                document.getElementById('tableList').innerHTML = '<div class="text-center text-danger py-4">加载失败</div>';
            }
        }

        function renderTables(tables) {
            const container = document.getElementById('tableList');
            if (!tables || tables.length === 0) {
                container.innerHTML = '<div class="text-center text-muted py-4">没有找到表</div>';
                return;
            }
            let html = '';
            tables.forEach(function(t) {
                const checked = selectedTables.has(t.tableName) ? 'checked' : '';
                const existsBadge = t.existsInTarget
                    ? '<span class="badge bg-success ms-1">已存在</span>'
                    : '<span class="badge bg-warning text-dark ms-1">新建</span>';
                const rowCount = t.rowCount !== undefined ? t.rowCount.toLocaleString() : '?';
                html += '<div class="form-check">'
                    + '<input class="form-check-input table-checkbox" type="checkbox" '
                    + 'id="tbl_' + t.tableName + '" value="' + t.tableName + '" ' + checked
                    + ' onchange="onTableCheck(this)">'
                    + '<label class="form-check-label d-flex align-items-center gap-2" for="tbl_' + t.tableName + '">'
                    + '<span>' + t.tableName + '</span>'
                    + existsBadge
                    + '<small class="text-muted">' + rowCount + ' 行</small>'
                    + '</label></div>';
            });
            container.innerHTML = html;
            updateSelectedCount();
        }

        function filterTables() {
            const filter = document.getElementById('tableFilter').value.toLowerCase();
            const filtered = filter ? allTables.filter(function(t) {
                return t.tableName.toLowerCase().includes(filter);
            }) : allTables;
            renderTables(filtered);
        }

        function onTableCheck(checkbox) {
            if (checkbox.checked) {
                selectedTables.add(checkbox.value);
            } else {
                selectedTables.delete(checkbox.value);
            }
            updateSelectedCount();
        }

        function selectAll(checked) {
            document.querySelectorAll('.table-checkbox').forEach(function(cb) {
                cb.checked = checked;
                if (checked) {
                    selectedTables.add(cb.value);
                } else {
                    selectedTables.delete(cb.value);
                }
            });
            updateSelectedCount();
        }

        function selectByStatus(notExists) {
            document.querySelectorAll('.table-checkbox').forEach(function(cb) {
                const tableName = cb.value;
                const table = allTables.find(function(t) { return t.tableName === tableName; });
                if (notExists && table && !table.existsInTarget) {
                    cb.checked = true;
                    selectedTables.add(tableName);
                } else {
                    cb.checked = false;
                    selectedTables.delete(tableName);
                }
            });
            updateSelectedCount();
        }

        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = '已选 ' + selectedTables.size + ' 张';
        }

        function updateStats() {
            document.getElementById('totalTables').textContent = allTables.length;
            const totalRows = allTables.reduce(function(sum, t) { return sum + (t.rowCount || 0); }, 0);
            document.getElementById('totalData').textContent = totalRows.toLocaleString();
        }

        function switchToConfig() {
            document.getElementById('config-tab').click();
        }

        function setLoading(loading) {
            const overlay = document.getElementById('spinnerOverlay');
            overlay.classList.toggle('active', loading);
        }

        function showToast(message, type) {
            const toastContainer = document.getElementById('toastContainer');
            const toastEl = document.createElement('div');
            toastEl.className = 'toast align-items-center text-bg-' + type + ' border-0 mb-2';
            toastEl.role = 'alert';
            toastEl.ariaLive = 'assertive';
            toastEl.ariaAtomic = 'true';
            toastEl.innerHTML = '<div class="d-flex"><div class="toast-body">' + message
                + '</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>';
            document.getElementById('toastContainer').appendChild(toastEl);
            const toast = new bootstrap.Toast(toastEl, { delay: 3500 });
            toast.show();
            toastEl.addEventListener('hidden.bs.toast', function() { toastEl.remove(); });
        }

        function addLog(tableName, phase, success, message) {
            const container = document.getElementById('logContainer');
            const firstChild = container.firstElementChild;
            if (firstChild && firstChild.textContent.trim() === '等待执行...') {
                container.innerHTML = '';
            }
            const phaseLabel = phase === 'STRUCTURE' ? '结构' : phase === 'DATA' ? '数据' : phase;
            const phaseClass = phase === 'STRUCTURE' ? 'phase-struct' : phase === 'DATA' ? 'phase-data' : 'bg-secondary';
            const logClass = success ? 'log-success' : 'log-error';
            const statusBadge = success
                ? '<span class="badge bg-success" style="font-size:11px">OK</span>'
                : '<span class="badge bg-danger" style="font-size:11px">FAIL</span>';
            const div = document.createElement('div');
            div.className = 'log-item ' + logClass;
            div.innerHTML = '<span class="log-phase ' + phaseClass + '">' + phaseLabel + '</span>'
                + statusBadge
                + ' <span style="color:#aaa;flex-shrink:0">' + tableName + '</span>'
                + ' <span style="color:#888;flex:1;word-break:break-all">' + (message || '') + '</span>';
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function clearLog() {
            const container = document.getElementById('logContainer');
            container.innerHTML = '<div class="log-item log-info"><span class="text-muted">等待执行...</span></div>';
            document.getElementById('progressSummary').textContent = '';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressText').textContent = '等待开始...';
        }

        function startMigration() {
            if (selectedTables.size === 0) {
                showToast('请至少选择一张表', 'warning');
                return;
            }

            const structure = document.getElementById('migrateStructure').checked;
            const data = document.getElementById('migrateData').checked;
            const batchSize = parseInt(document.getElementById('batchSize').value) || 1000;

            if (!structure && !data) {
                showToast('请至少选择一种迁移类型（结构或数据）', 'warning');
                return;
            }

            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            document.getElementById('startBtnText').textContent = '迁移中...';
            clearLog();

            document.getElementById('progress-tab').click();

            const tablesParam = Array.from(selectedTables).join(',');
            const url = '/migration/stream?tables=' + encodeURIComponent(tablesParam)
                + '&structure=' + structure + '&data=' + data + '&batchSize=' + batchSize;

            const eventSource = new EventSource(url);
            let successCount = 0;
            let failCount = 0;

            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.done) {
                    eventSource.close();
                    btn.disabled = false;
                    document.getElementById('startBtnText').textContent = '开始迁移';
                    showToast(data.message || '迁移完成', failCount > 0 ? 'warning' : 'success');
                    loadTables();
                    return;
                }
                if (data.tableName) {
                    addLog(data.tableName, data.phase, data.success, data.message || '');
                    if (data.success) {
                        successCount++;
                    } else {
                        failCount++;
                    }
                }
                const total = data.total || 0;
                const completed = data.completed || 0;
                const pct = total > 0 ? (completed / total * 100) : 0;
                document.getElementById('progressBar').style.width = pct + '%';
                document.getElementById('progressText').textContent = data.message || '迁移中... (' + completed + '/' + total + ')';
                document.getElementById('progressSummary').textContent = '成功: ' + successCount + ' | 失败: ' + failCount;
            };

            eventSource.onerror = function() {
                eventSource.close();
                btn.disabled = false;
                document.getElementById('startBtnText').textContent = '开始迁移';
                showToast('迁移连接中断', 'danger');
            };
        }
    </script>
</body>
</html>
